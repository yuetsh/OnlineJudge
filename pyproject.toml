[project]
name = "onlinejudge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.2.0",
    "channels-redis>=4.2.0",
    "daphne>=4.1.2",
    "django>=5.2.3",
    "django-cas-ng==5.0.1",
    "django-dbconn-retry==0.1.8",
    "django-dramatiq==0.13.0",
    "django-redis==5.4.0",
    "djangorestframework==3.16.0",
    "dramatiq==1.17.0",
    "entrypoints==0.4",
    "envelopes==0.4",
    "gunicorn==22.0.0",
    "jsonfield==3.1.0",
    "openai>=1.108.1",
    "otpauth==1.0.1",
    "pillow==10.2.0",
    "psycopg==3.2.9",
    "psycopg-binary==3.2.9",
    "python-dateutil==2.8.2",
    "qrcode==8.2",
    "raven==6.10.0",
    "xlsxwriter==3.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 180
exclude = ["*/migrations/*", "*settings.py", "*/apps.py", ".venv"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]
